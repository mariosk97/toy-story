
<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woody 3D Game</title>
    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="./script.js"></script>
</head>
<body>
    <div id="hud">
        <div id="gameTitle">WOODY 3D</div>
        <div id="status">Επίλεξε επίπεδο δυσκολίας.</div>
        <div id="scoreDisplay">Αστέρια: 0</div>

        <div id="controls">
            <span>W A S D / ΒΕΛΑΚΙΑ — Κίνηση</span>
            <span>SPACE — Άλμα</span>
        </div>
    </div>

    <div id="difficultyPanel" class="overlay">
        <div class="panel">
            <h1>Πάμε να παίξουμε!</h1>
            <p>Διάλεξε επίπεδο δυσκολίας.</p>

            <div class="buttonRow">
                <button id="easyButton" class="answerButton easyButton">
                    Εύκολο
                </button>

                <button id="hardButton" class="answerButton hardButton">
                    Δύσκολο
                </button>
            </div>
        </div>
    </div>

    <div id="questionPanel" class="overlay hidden">
        <div class="panel questionBox">
            <h2 id="questionText">Ερώτηση</h2>

            <div id="answersContainer" class="answersContainer"></div>

            <p id="answerFeedback" aria-live="polite"></p>
        </div>
    </div>
</body>
</html>
